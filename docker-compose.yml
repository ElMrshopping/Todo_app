services:
  db :
    container_name: postgres-taskmanagement
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - taskdata:/var/lib/postgresql
    networks:
      - taskdb
networks:
  taskdb:
    driver: bridge
volumes:
  taskdata: